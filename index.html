<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายชื่อผู้ป่วย | ระบบประวัติผู้ป่วยเทศบาล</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      navy: { 900: '#0a1f33', 800: '#0f2a44', 700: '#1b3b5f', 600: '#27527f' },
      teal: { 600: '#0d8f8c', 500: '#14a8a4', 400: '#2cc9c4' },
      gold: { 600: '#b8901f', 500: '#d4a72c', 400: '#e8c15c' }
    } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-header"></div>

  <main class="max-w-5xl mx-auto px-3 sm:px-4 py-4 pb-24">

    <!-- แจ้งเตือนเมื่อเจ้าหน้าที่พยายามเข้าหน้าของผู้ดูแลระบบ -->
    <div id="denied-note" class="alert alert-warn mb-4 hidden">
      หน้านั้นเปิดได้เฉพาะผู้ดูแลระบบ (admin) เท่านั้น ระบบจึงพากลับมาที่หน้ารายชื่อผู้ป่วย
    </div>

    <!-- สรุปจำนวน -->
    <section class="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
      <div class="card p-3 text-center">
        <div id="summary-all" class="text-2xl font-bold text-navy-800">–</div>
        <div class="text-xs text-slate-500 mt-0.5">ผู้ป่วยทั้งหมด</div>
      </div>
      <div class="card p-3 text-center" style="border-top:3px solid #dc2626">
        <div id="summary-bedridden" class="text-2xl font-bold text-red-700">–</div>
        <div class="text-xs text-slate-500 mt-0.5">ติดเตียง</div>
      </div>
      <div class="card p-3 text-center" style="border-top:3px solid #0d8f8c">
        <div id="summary-general" class="text-2xl font-bold text-teal-600">–</div>
        <div class="text-xs text-slate-500 mt-0.5">ทั่วไป</div>
      </div>
    </section>

    <!-- ค้นหา + ตัวกรอง -->
    <section class="card p-3 sm:p-4 mb-4">
      <label class="field-label" for="search-input">ค้นหาผู้ป่วย</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">🔍</span>
        <input id="search-input" type="search" class="field pl-9 pr-20"
               placeholder="พิมพ์ชื่อ นามสกุล หรือรหัสผู้ป่วย" autocomplete="off" />
        <button type="button" id="btn-clear-search"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-500 px-3 py-2 rounded-lg hover:bg-slate-100">
          ล้าง
        </button>
      </div>

      <div class="flex gap-2 mt-3 overflow-x-auto pb-1">
        <button type="button" data-type-filter="all" class="btn btn-primary !min-h-[44px] !py-2 !px-4 text-sm whitespace-nowrap">ทั้งหมด</button>
        <button type="button" data-type-filter="bedridden" class="btn btn-ghost !min-h-[44px] !py-2 !px-4 text-sm whitespace-nowrap">ผู้ป่วยติดเตียง</button>
        <button type="button" data-type-filter="general" class="btn btn-ghost !min-h-[44px] !py-2 !px-4 text-sm whitespace-nowrap">ผู้ป่วยทั่วไป</button>
      </div>

      <div id="result-count" class="text-xs text-slate-500 mt-3"></div>
    </section>

    <!-- สถานะ: กำลังโหลด -->
    <div id="state-loading" class="space-y-3">
      <div class="skeleton h-28"></div>
      <div class="skeleton h-28"></div>
      <div class="skeleton h-28"></div>
    </div>

    <!-- สถานะ: ผิดพลาด -->
    <div id="state-error" class="card p-6 text-center hidden">
      <div class="text-4xl mb-2">⚠️</div>
      <h2 class="font-bold text-navy-800 mb-1">โหลดข้อมูลไม่สำเร็จ</h2>
      <p id="state-error-text" class="text-sm text-slate-600 mb-4">เกิดข้อผิดพลาด</p>
      <button type="button" id="btn-retry" class="btn btn-primary">ลองใหม่อีกครั้ง</button>
    </div>

    <!-- สถานะ: ไม่มีข้อมูล -->
    <div id="state-empty" class="card p-8 text-center hidden">
      <div class="text-4xl mb-2">📭</div>
      <h2 class="font-bold text-navy-800 mb-1">ไม่พบข้อมูล</h2>
      <p id="state-empty-text" class="text-sm text-slate-600">ยังไม่มีข้อมูลผู้ป่วยในระบบ</p>
    </div>

    <!-- รายการผู้ป่วย -->
    <div id="patient-list" class="grid gap-3 sm:grid-cols-2 hidden"></div>

  </main>

  <!-- ปุ่มเพิ่มผู้ป่วย (เฉพาะผู้ดูแลระบบ) -->
  <a id="fab-add" href="patient-form.html"
     class="hidden fixed bottom-5 right-5 btn btn-gold shadow-xl !rounded-full !px-5 text-base font-bold z-20">
    <span class="text-xl leading-none">＋</span> เพิ่มผู้ป่วย
  </a>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/patients.js"></script>
  <script>
    (function () {
      if (!Auth.requireLogin()) return;
      Auth.renderHeader('index.html');

      if (Auth.isAdmin()) document.getElementById('fab-add').classList.remove('hidden');

      if (new URLSearchParams(window.location.search).get('denied') === '1') {
        document.getElementById('denied-note').classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
